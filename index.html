<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DatSlaps</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&display=swap" rel="stylesheet">
  <meta property="og:image" content="https://www.datslaps.co.uk/assets/bg.jpg">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    html {
      background: #c8b99a;
    }

    body {
      min-height: 100vh;
      /* Visible height with the phone browser's toolbars showing, so the form is in frame on landing */
      min-height: 100svh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      color: #2c2519;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      /* Sideways finger drags drive the sway instead of being taken over by the browser */
      touch-action: pan-y pinch-zoom;
    }

    /* Background, built from layers like the PSD: wall gradient → arm (multiply) → logo → grain (overlay).
       Pinned to the visible screen with insets rather than viewport units, which phones
       recalculate unreliably when rotating. */
    .stage {
      --art-h: min(100%, 201.84vw);
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
      /* Wall colours. "chalk" (from the mockup) is in use; "sunset" is the orange/yellow gradient;
         "stone" is the lighting sampled from the original artwork. Swap the var() below to change
         it, or preview with ?wall=chalk / ?wall=sunset / ?wall=stone.
         Sunset's first colour is 65% opaque, so it sits over white, as it would in a design tool. */
      --wall-chalk: linear-gradient(#edebe8 0%, #ebebe8 50%, #e9e9de 73%, #e6e1d2 94%, #e4ddcf 100%) #ebebe8;
      --wall-sunset: linear-gradient(311deg, #fff58da6, #f3c17f) #fff;
      --wall-stone: linear-gradient(#c6ba9d 0%, #c5b99c 20%, #c1b69a 30%, #bcb297 40%, #b6ad93 50%, #aea48b 60%, #a59c84 70%, #9c937e 80%, #918976 90%, #8d8572 100%) #c8b99a;
      background: var(--wall-chalk);
    }

    :root[data-wall="chalk"] .stage { background: var(--wall-chalk); }
    :root[data-wall="stone"] .stage { background: var(--wall-stone); }
    :root[data-wall="sunset"] .stage { background: var(--wall-sunset); }

    /* Arm and logo share the artboard (846.14 × 1136.98). Full screen height; on narrow screens
       capped at 1.5× the width so only empty wall is cropped and the arm stays fully in view.
       Both rotate around a pivot below the screen, near the elbow. */
    .layer {
      position: absolute;
      bottom: 0;
      left: 50%;
      height: var(--art-h);
      width: auto;
      aspect-ratio: 846.14 / 1136.98;
      --sway: 0deg;
      transform: translateX(-50%) rotate(var(--sway));
      transform-origin: 50.4% 130%;
      will-change: transform;
      overflow: visible;
    }

    /* Multiply with a cool grey, faded to 47%, gives the mockup's soft grey shadow (~#9b9e9a),
       picking up the wall's warmth where it changes. Only the arm is faded, not the logo. */
    .arm {
      fill: #414c4f;
      mix-blend-mode: multiply;
      opacity: 0.47;
    }

    .logo { fill: #fff; }

    .headline {
      position: fixed;
      top: calc(36px + env(safe-area-inset-top));
      left: 0;
      right: 0;
      margin: 0;
      font-weight: 800;
      /* Sized from the screen height, like the arm, so the two stay in proportion (32px at ~950px tall) */
      font-size: clamp(1.125rem, min(3.4svh, 6.5vw), 2.25rem);
      line-height: 1;
      letter-spacing: 0.5em;
      /* Letter spacing also trails the last letter; matching padding on the left keeps it centred */
      padding-left: 0.5em;
      text-align: center;
      text-transform: uppercase;
      color: #aeacaa;
      pointer-events: none;
    }

    .grain {
      position: absolute;
      inset: 0;
      background: url("assets/noise.png") 0 0 / 384px 384px repeat;
      mix-blend-mode: overlay;
      opacity: 0.32;
    }

    /* Grain drawn at 0.75× (finer, like the original artwork) and kept the same physical size on high-density screens */
    @media (min-resolution: 2dppx) {
      .grain { background-size: 192px 192px; }
    }

    @media (min-resolution: 3dppx) {
      .grain { background-size: 128px 128px; }
    }

    .bar {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      text-align: center;
    }

    .signup {
      display: flex;
      background: #fff;
      border-radius: 4px;
      overflow: hidden;
    }

    .signup input[type="email"] {
      flex: 1;
      min-width: 0;
      padding: 14px 18px;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 16px;
      color: inherit;
      outline: none;
    }

    .signup input[type="email"]::placeholder {
      color: #75756f;
    }

    .signup button {
      padding: 14px 20px;
      border: 0;
      background: #c62525;
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .age {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: #fff;
    }

    .status {
      min-height: 1.2em;
      margin: 8px 0 0;
      font-size: 13px;
      color: #fff;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
    }

    .socials a {
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .socials svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Landscape phones: too short to show the whole arm with the heading and form, so enlarge the
       arm and crop its lower part, and tuck the heading closer to the top. The can sits ~21.5% down the
       artboard; at 150% of the screen height and shifted up 10.25%, the top of the can lands 22%
       from the top of the screen, below the heading, with the logo clear of the form */
    @media (orientation: landscape) and (max-height: 540px) {
      .layer {
        top: -10.25%;
        bottom: auto;
        height: 150%;
      }

      .headline {
        top: calc(14px + env(safe-area-inset-top));
        font-size: clamp(1rem, 6svh, 1.5rem);
      }

      .bar { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .socials { margin-top: 6px; }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>

  <h1 class="headline">Coming soon</h1>
  <div class="bar">
    <form class="signup" id="signup">
      <label for="email" class="visually-hidden">Email address</label>
      <input type="email" id="email" name="email" placeholder="Your email" required autocomplete="email">
      <button type="submit">Tap in with us</button>
    </form>
    <label class="age"><input type="checkbox" form="signup" name="age" required> I'm 18 or over</label>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <nav class="socials" aria-label="Social media">
      <a href="https://www.instagram.com/dat.slaps/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5A4.25 4.25 0 0 0 20.5 16.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm5.25-2.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>

  <script>
    // ?wall=stone or ?wall=sunset previews either wall gradient
    const wall = new URLSearchParams(location.search).get('wall');
    if (wall) document.documentElement.dataset.wall = wall;

    // Sway: the arm leans towards the cursor on desktop. On touch screens it sways gently on its
    // own, leans towards a finger while touching, and follows the phone's tilt where the browser
    // allows it without a permission prompt (Android). iPhones require a prompt, so they get the
    // idle and touch sway only. Stops when the device asks for reduced motion, and is off entirely
    // with ?still in the URL (handy for editing styles in DevTools).
    (() => {
      if (new URLSearchParams(location.search).has('still')) return;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

      const MAX = 4;          // degrees either way
      const TILT_RANGE = 25;  // degrees of phone tilt for full sway
      const IDLE_AMPLITUDE = 1.5;
      const IDLE_PERIOD = 6;  // seconds per sway cycle
      const IDLE_AFTER = 2000; // ms without input before idle sway resumes

      // Only the moving layers get the angle, so nothing else restyles every frame
      const layers = document.querySelectorAll('.layer');
      const clamp = (v) => Math.max(-1, Math.min(1, v));

      let input = null;       // -1…1 from cursor, finger or tilt; null when idle
      let lastInput = -Infinity;
      let angle = 0;
      let written = 0;
      let last = performance.now();

      function setInput(value) {
        input = clamp(value);
        lastInput = performance.now();
      }

      const fromX = (x) => (x / innerWidth - 0.5) * 2;

      addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) setInput(fromX(e.clientX));
      }, { passive: true });
      addEventListener('pointerdown', (e) => setInput(fromX(e.clientX)), { passive: true });
      document.documentElement.addEventListener('mouseleave', () => { input = null; });
      addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') input = null; });
      addEventListener('pointercancel', () => { input = null; });

      // Tilt, only where no permission prompt is needed
      if ('DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission !== 'function') {
        addEventListener('deviceorientation', (e) => {
          if (e.gamma == null) return;
          // Left-right tilt is gamma in portrait; in landscape it's beta, flipped by rotation direction
          const turn = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
          const tilt = turn === 90 ? e.beta : turn === -90 || turn === 270 ? -e.beta : turn === 180 ? -e.gamma : e.gamma;
          setInput(tilt / TILT_RANGE);
        });
      }

      function write(value) {
        if (Math.abs(value - written) < 0.005) return;
        written = value;
        layers.forEach((layer) => layer.style.setProperty('--sway', value.toFixed(3) + 'deg'));
      }

      function frame(now) {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;

        if (reduceMotion.matches) {
          angle = 0;
          write(0);
          requestAnimationFrame(frame);
          return;
        }

        let target;
        if (input !== null && now - lastInput < IDLE_AFTER) {
          target = input * MAX;
        } else if (input !== null && matchMedia('(hover: hover)').matches) {
          target = input * MAX; // a resting cursor keeps its lean
        } else {
          target = Math.sin((now / 1000) * (2 * Math.PI / IDLE_PERIOD)) * IDLE_AMPLITUDE;
        }

        // Ease towards the target with a slight lag, which reads as weight
        angle += (target - angle) * (1 - Math.exp(-dt * 4));
        write(angle);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();

    // Klaviyo public key and list ID are safe to publish: they only allow subscribing.
    const KLAVIYO_PUBLIC_KEY = 'XFG94h';
    const KLAVIYO_LIST_ID = 'YeFbmS';

    const form = document.getElementById('signup');
    const status = document.getElementById('status');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = '';

      try {
        const res = await fetch(`https://a.klaviyo.com/client/subscriptions/?company_id=${KLAVIYO_PUBLIC_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/vnd.api+json', revision: '2024-10-15' },
          body: JSON.stringify({
            data: {
              type: 'subscription',
              attributes: {
                custom_source: 'Coming soon page',
                profile: {
                  data: {
                    type: 'profile',
                    attributes: {
                      email: form.email.value.trim(),
                      properties: { age_confirmed_18: true }
                    }
                  }
                }
              },
              relationships: { list: { data: { type: 'list', id: KLAVIYO_LIST_ID } } }
            }
          })
        });
        if (!res.ok) throw new Error(res.status);
        form.reset();
        document.querySelector('.age input').checked = false;
        status.textContent = 'Thanks! Check your inbox to confirm.';
      } catch {
        status.textContent = 'Something went wrong. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
