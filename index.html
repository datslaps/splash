<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DatSlaps</title>
  <meta name="theme-color" content="#c9191f">
  <meta property="og:image" content="https://www.datslaps.co.uk/assets/bg.jpg">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    /* Matches the wall, since phones paint this colour beside the notch in landscape */
    html {
      background: #c9191f;
    }

    body {
      height: 100vh;
      /* Visible height with the phone browser's toolbars showing, so the form is in frame on landing */
      height: 100svh;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      color: #2c2519;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      /* Sideways finger drags drive the sway instead of being taken over by the browser */
      touch-action: pan-y pinch-zoom;
    }

    /* Background: wall colour with grain over it. Pinned to the visible screen with insets rather
       than viewport units, which phones recalculate unreliably when rotating. */
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
      /* Wall colours. "red" (#c9191f) is in use; "mist" is the neutral off-white; "chalk" is the warmer off-white;
         "sunset" is the orange/yellow gradient; "stone" is the lighting sampled from the original
         artwork. Swap the var() below to change it, or preview with ?wall=red / mist / chalk / sunset / stone.
         Sunset's first colour is 65% opaque, so it sits over white, as it would in a design tool. */
      --wall-red: #c9191f;
      --wall-mist: linear-gradient(#f1f1f1 0%, #f7f7f7 23%, #fbfbfb 37%, #fdfdfd 52%, #fdfdfd 65%, #f7f7f7 80%, #f2f2f2 89%, #eaeaea 100%) #fbfbfb;
      --wall-chalk: linear-gradient(#edebe8 0%, #ebebe8 50%, #e9e9de 73%, #e6e1d2 94%, #e4ddcf 100%) #ebebe8;
      --wall-sunset: linear-gradient(311deg, #fff58da6, #f3c17f) #fff;
      --wall-stone: linear-gradient(#c6ba9d 0%, #c5b99c 20%, #c1b69a 30%, #bcb297 40%, #b6ad93 50%, #aea48b 60%, #a59c84 70%, #9c937e 80%, #918976 90%, #8d8572 100%) #c8b99a;
      background: var(--wall-red);
    }

    :root[data-wall="red"] .stage { background: var(--wall-red); }
    :root[data-wall="mist"] .stage { background: var(--wall-mist); }
    :root[data-wall="chalk"] .stage { background: var(--wall-chalk); }
    :root[data-wall="stone"] .stage { background: var(--wall-stone); }
    :root[data-wall="sunset"] .stage { background: var(--wall-sunset); }

    /* The stamp fills the space above the form, centred. It tilts around its own centre with the
       cursor, touch or phone tilt (see the sway script). */
    .hero {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .stamp {
      --sway: 0deg;
      width: min(72vw, 620px);
      max-height: 100%;
      fill: #000;
      overflow: visible;
      transform: rotate(var(--sway));
      will-change: transform;
    }

    .grain {
      position: absolute;
      inset: 0;
      background: url("assets/noise.png") 0 0 / 384px 384px repeat;
      mix-blend-mode: overlay;
      opacity: 0.32;
    }

    /* Grain drawn at 0.75× (finer, like the original artwork) and kept the same physical size on high-density screens */
    @media (min-resolution: 2dppx) {
      .grain { background-size: 192px 192px; }
    }

    @media (min-resolution: 3dppx) {
      .grain { background-size: 128px 128px; }
    }

    .bar {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      text-align: center;
    }

    /* RSVP link to the Partiful event: skewed black button with a hard offset shadow that turns
       white on hover and presses in when tapped */
    .rsvp {
      display: inline-block;
      padding: 12px 28px;
      background: #000;
      color: #fff;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-decoration: none;
      transform: skewX(-12deg);
      box-shadow: 4px 4px 0 #7d0f13;
      transition: box-shadow 0.3s, transform 0.15s;
    }

    .rsvp span { display: inline-block; transform: skewX(12deg); }

    .rsvp:hover, .rsvp:focus-visible {
      outline: none;
      box-shadow: 7px 7px 0 #fff;
    }

    .rsvp:active {
      transform: skewX(-12deg) translate(4px, 4px);
      box-shadow: 0 0 0 #fff;
      transition: box-shadow 0.08s, transform 0.08s;
    }

    @media (prefers-reduced-motion: reduce) {
      .rsvp { transition: none; }
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }

    .socials a {
      display: flex;
      width: 48px;
      height: 48px;
      align-items: center;
      justify-content: center;
      color: #000;
    }

    .socials svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
    }

    /* Portrait phones: smaller icons */
    @media (max-width: 520px) {
      .socials a,
      .socials svg {
        width: 34px;
        height: 34px;
      }

      .socials { gap: 18px; }
    }

    /* Landscape phones: tighten spacing and shrink the icons */
    @media (orientation: landscape) and (max-height: 540px) {
      .hero { padding: 12px 16px 8px; }

      .bar { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .socials { margin-top: 6px; gap: 18px; }

      .socials a,
      .socials svg {
        width: 34px;
        height: 34px;
      }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>

  <script>
    // ?wall=stone or ?wall=sunset previews either wall gradient
    const wall = new URLSearchParams(location.search).get('wall');
    if (wall) document.documentElement.dataset.wall = wall;

    // Sway: the stamp tilts towards the cursor on desktop. On touch screens it sways gently on its
    // own, leans towards a finger while touching, and follows the phone's tilt where the browser
    // allows it without a permission prompt (Android). iPhones require a prompt, so they get the
    // idle and touch sway only. Stops when the device asks for reduced motion, and is off entirely
    // with ?still in the URL (handy for editing styles in DevTools).
    (() => {
      if (new URLSearchParams(location.search).has('still')) return;
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

      const MAX = 4;          // degrees either way
      const TILT_RANGE = 25;  // degrees of phone tilt for full sway
      const IDLE_AMPLITUDE = 1.5;
      const IDLE_PERIOD = 6;  // seconds per sway cycle
      const IDLE_AFTER = 2000; // ms without input before idle sway resumes

      // Only the stamp gets the angle, so nothing else restyles every frame
      const layers = document.querySelectorAll('.stamp');
      const clamp = (v) => Math.max(-1, Math.min(1, v));

      let input = null;       // -1…1 from cursor, finger or tilt; null when idle
      let lastInput = -Infinity;
      let angle = 0;
      let written = 0;
      let last = performance.now();

      function setInput(value) {
        input = clamp(value);
        lastInput = performance.now();
      }

      const fromX = (x) => (x / innerWidth - 0.5) * 2;

      addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) setInput(fromX(e.clientX));
      }, { passive: true });
      addEventListener('pointerdown', (e) => setInput(fromX(e.clientX)), { passive: true });
      document.documentElement.addEventListener('mouseleave', () => { input = null; });
      addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') input = null; });
      addEventListener('pointercancel', () => { input = null; });

      // Tilt, only where no permission prompt is needed
      if ('DeviceOrientationEvent' in window && typeof DeviceOrientationEvent.requestPermission !== 'function') {
        addEventListener('deviceorientation', (e) => {
          if (e.gamma == null) return;
          // Left-right tilt is gamma in portrait; in landscape it's beta, flipped by rotation direction
          const turn = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
          const tilt = turn === 90 ? e.beta : turn === -90 || turn === 270 ? -e.beta : turn === 180 ? -e.gamma : e.gamma;
          setInput(tilt / TILT_RANGE);
        });
      }

      function write(value) {
        if (Math.abs(value - written) < 0.005) return;
        written = value;
        layers.forEach((layer) => layer.style.setProperty('--sway', value.toFixed(3) + 'deg'));
      }

      function frame(now) {
        const dt = Math.min(0.1, (now - last) / 1000);
        last = now;

        if (reduceMotion.matches) {
          angle = 0;
          write(0);
          requestAnimationFrame(frame);
          return;
        }

        let target;
        if (input !== null && now - lastInput < IDLE_AFTER) {
          target = input * MAX;
        } else if (input !== null && matchMedia('(hover: hover)').matches) {
          target = input * MAX; // a resting cursor keeps its lean
        } else {
          target = Math.sin((now / 1000) * (2 * Math.PI / IDLE_PERIOD)) * IDLE_AMPLITUDE;
        }

        // Ease towards the target with a slight lag, which reads as weight
        angle += (target - angle) * (1 - Math.exp(-dt * 4));
        write(angle);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
