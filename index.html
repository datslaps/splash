<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DatSlaps</title>
  <style>
    :root {
      /* Image height: full viewport height. On narrow screens it is capped at 1.5× the width (image ratio 1600×2153), so only plain wall is cropped from the sides and the arm stays fully in view */
      --art-h: min(100vh, 201.84vw);
    }

    @supports (height: 100dvh) {
      :root { --art-h: min(100dvh, 201.84vw); }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    html {
      /* Wall gradient sampled from the image's edges, so the space beside the image blends in */
      background:
        linear-gradient(#c6ba9d 0%, #c5b99c 20%, #c1b69a 30%, #bcb297 40%, #b6ad93 50%, #aea48b 60%, #a59c84 70%, #9c937e 80%, #918976 90%, #8d8572 100%)
        center bottom / 100% var(--art-h) no-repeat,
        #c8b99a;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #2c2519;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    .art {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: var(--art-h);
      width: auto;
      z-index: -1;
      pointer-events: none;
      user-select: none;
      -webkit-mask-image:
        linear-gradient(to right, transparent, #000 8%, #000 92%, transparent),
        linear-gradient(to bottom, transparent, #000 5%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent, #000 8%, #000 92%, transparent),
        linear-gradient(to bottom, transparent, #000 5%);
      mask-composite: intersect;
    }

    .bar {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 0 16px 32px;
      box-sizing: border-box;
      text-align: center;
    }

    .signup {
      display: flex;
      background: #c8b99a;
      border-radius: 999px;
      overflow: hidden;
    }

    .signup input[type="email"] {
      flex: 1;
      min-width: 0;
      padding: 14px 18px;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 16px;
      color: inherit;
      outline: none;
    }

    .signup input[type="email"]::placeholder {
      color: rgba(44, 37, 25, 0.65);
    }

    .signup button {
      padding: 14px 20px;
      border: 0;
      background: #2c2519;
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .age {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: #fff;
    }

    .status {
      min-height: 1.2em;
      margin: 8px 0 0;
      font-size: 13px;
      color: #fff;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
    }

    .socials a {
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .socials svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <img class="art" src="assets/bg.jpg" srcset="assets/bg.jpg 1600w, assets/bg-2400.jpg 2400w" sizes="min(74.3vh, 150vw)" alt="" aria-hidden="true">
  <div class="bar">
    <form class="signup" id="signup">
      <label for="email" class="visually-hidden">Email address</label>
      <input type="email" id="email" name="email" placeholder="Your email" required autocomplete="email">
      <button type="submit">Tap in with us</button>
    </form>
    <label class="age"><input type="checkbox" form="signup" name="age" required> I'm 18 or over</label>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <nav class="socials" aria-label="Social media">
      <a href="https://www.instagram.com/dat.slaps/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5A4.25 4.25 0 0 0 20.5 16.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm5.25-2.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
      </a>
      <a href="https://www.tiktok.com/@datslaps" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.82A4.278 4.278 0 0 1 13.81 3h-2.77v12.4a2.592 2.592 0 0 1-2.59 2.49c-1.42 0-2.6-1.16-2.6-2.59 0-1.72 1.66-3.01 3.37-2.48V9.96c-3.45-.46-6.47 2.22-6.47 5.64 0 3.07 2.53 5.59 5.7 5.4 3.36-.2 5.02-2.63 5.02-5.3V9.41a7.382 7.382 0 0 0 4.34 1.4V8.04c-.002 0-1.88-.18-3.31-2.22z"/></svg>
      </a>
    </nav>
  </div>

  <script>
    // Klaviyo public key and list ID are safe to publish: they only allow subscribing.
    const KLAVIYO_PUBLIC_KEY = 'XFG94h';
    const KLAVIYO_LIST_ID = 'YeFbmS';

    const form = document.getElementById('signup');
    const status = document.getElementById('status');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = '';

      try {
        const res = await fetch(`https://a.klaviyo.com/client/subscriptions/?company_id=${KLAVIYO_PUBLIC_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/vnd.api+json', revision: '2024-10-15' },
          body: JSON.stringify({
            data: {
              type: 'subscription',
              attributes: {
                custom_source: 'Coming soon page',
                profile: {
                  data: {
                    type: 'profile',
                    attributes: {
                      email: form.email.value.trim(),
                      properties: { age_confirmed_18: true }
                    }
                  }
                }
              },
              relationships: { list: { data: { type: 'list', id: KLAVIYO_LIST_ID } } }
            }
          })
        });
        if (!res.ok) throw new Error(res.status);
        form.reset();
        document.querySelector('.age input').checked = false;
        status.textContent = 'Thanks! Check your inbox to confirm.';
      } catch {
        status.textContent = 'Something went wrong. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
