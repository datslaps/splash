<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DatSlaps</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    html {
      background: #c8b99a;
    }

    body {
      min-height: 100vh;
      /* Visible height with the phone browser's toolbars showing, so the form is in frame on landing */
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      color: #2c2519;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
    }

    /* Background frame: pinned to the visible screen with insets rather than viewport units,
       which phones recalculate unreliably when rotating */
    .stage {
      --art-h: min(100%, 201.84vw);
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
      /* Wall gradient sampled from the image's edges; the script adds matching grain on top */
      background:
        linear-gradient(#c6ba9d 0%, #c5b99c 20%, #c1b69a 30%, #bcb297 40%, #b6ad93 50%, #aea48b 60%, #a59c84 70%, #9c937e 80%, #918976 90%, #8d8572 100%)
        center bottom / 100% var(--art-h) no-repeat,
        #c8b99a;
    }

    .wall {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Full height of the screen; on narrow screens capped at 1.5× the width (image is 1600×2153),
       so only plain wall is cropped from the sides and the arm stays fully in view */
    .art {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: var(--art-h);
      width: auto;
      pointer-events: none;
      user-select: none;
      -webkit-mask-image:
        linear-gradient(to right, transparent, #000 8%, #000 92%, transparent),
        linear-gradient(to bottom, transparent, #000 5%);
      -webkit-mask-composite: source-in;
      mask-image:
        linear-gradient(to right, transparent, #000 8%, #000 92%, transparent),
        linear-gradient(to bottom, transparent, #000 5%);
      mask-composite: intersect;
    }

    .bar {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      box-sizing: border-box;
      text-align: center;
    }

    .signup {
      display: flex;
      background: #c8b99a;
      border-radius: 999px;
      overflow: hidden;
    }

    .signup input[type="email"] {
      flex: 1;
      min-width: 0;
      padding: 14px 18px;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 16px;
      color: inherit;
      outline: none;
    }

    .signup input[type="email"]::placeholder {
      color: rgba(44, 37, 25, 0.65);
    }

    .signup button {
      padding: 14px 20px;
      border: 0;
      background: #2c2519;
      color: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .age {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
      font-size: 12px;
      color: #fff;
    }

    .status {
      min-height: 1.2em;
      margin: 8px 0 0;
      font-size: 13px;
      color: #fff;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
    }

    .socials a {
      display: flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .socials svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Landscape phones: arm on the left, form on the right, so the form doesn't cover the arm */
    @media (orientation: landscape) and (max-height: 540px) {
      body {
        justify-content: center;
        align-items: flex-end;
      }

      .art { left: 30%; }

      .bar {
        width: 50%;
        max-width: 380px;
        margin-right: max(16px, calc(25vw - 190px));
        padding-bottom: 0;
      }

      .age, .status, .socials a { color: #2c2519; }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <canvas class="wall"></canvas>
    <img class="art" src="assets/bg.jpg" srcset="assets/bg.jpg 1600w, assets/bg-2400.jpg 2400w" sizes="min(74.3vh, 150vw)" alt="">
  </div>
  <div class="bar">
    <form class="signup" id="signup">
      <label for="email" class="visually-hidden">Email address</label>
      <input type="email" id="email" name="email" placeholder="Your email" required autocomplete="email">
      <button type="submit">Tap in with us</button>
    </form>
    <label class="age"><input type="checkbox" form="signup" name="age" required> I'm 18 or over</label>
    <p class="status" id="status" role="status" aria-live="polite"></p>

    <nav class="socials" aria-label="Social media">
      <a href="https://www.instagram.com/dat.slaps/" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2zm0 1.5A4.25 4.25 0 0 0 3.5 7.75v8.5A4.25 4.25 0 0 0 7.75 20.5h8.5A4.25 4.25 0 0 0 20.5 16.25v-8.5A4.25 4.25 0 0 0 16.25 3.5h-8.5zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 1.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm5.25-2.5a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>
      </a>
      <a href="https://www.tiktok.com/@datslaps" target="_blank" rel="noopener" aria-label="TikTok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.6 5.82A4.278 4.278 0 0 1 13.81 3h-2.77v12.4a2.592 2.592 0 0 1-2.59 2.49c-1.42 0-2.6-1.16-2.6-2.59 0-1.72 1.66-3.01 3.37-2.48V9.96c-3.45-.46-6.47 2.22-6.47 5.64 0 3.07 2.53 5.59 5.7 5.4 3.36-.2 5.02-2.63 5.02-5.3V9.41a7.382 7.382 0 0 0 4.34 1.4V8.04c-.002 0-1.88-.18-3.31-2.22z"/></svg>
      </a>
    </nav>
  </div>

  <script>
    // Paint the wall outside the image: the same gradient as the CSS fallback, with grain
    // copied from a plain patch of the image at its displayed size, so texture matches.
    (() => {
      const STOPS = [
        [0, '#c6ba9d'], [0.2, '#c5b99c'], [0.3, '#c1b69a'], [0.4, '#bcb297'], [0.5, '#b6ad93'],
        [0.6, '#aea48b'], [0.7, '#a59c84'], [0.8, '#9c937e'], [0.9, '#918976'], [1, '#8d8572']
      ];
      // Plain wall above and right of the can, as fractions of the image (clear of the arm)
      const PATCH = { x: 0.64, y: 0.03, w: 0.32, h: 0.28 };

      const stage = document.querySelector('.stage');
      const art = document.querySelector('.art');
      const canvas = document.querySelector('.wall');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      // A plain copy of whichever file the <img> picked, so sizes are real pixels
      // (with srcset, the <img> reports its size in display units instead)
      const source = new Image();
      source.decoding = 'async';

      function grainTile(scale) {
        const sw = source.naturalWidth * PATCH.w;
        const sh = source.naturalHeight * PATCH.h;
        const tw = Math.max(96, Math.round(sw * scale));
        const th = Math.max(96, Math.round(sh * scale));

        // Shrink in halving steps, like the browser's own smoothing when it displays the image;
        // a single big downscale keeps too much grain and looks harsher than the image
        let src = source, sx = source.naturalWidth * PATCH.x, sy = source.naturalHeight * PATCH.y, cw = sw, ch = sh;
        while (cw / 2 > tw) {
          const step = new OffscreenCanvas(Math.round(cw / 2), Math.round(ch / 2)).getContext('2d');
          step.imageSmoothingQuality = 'high';
          step.drawImage(src, sx, sy, cw, ch, 0, 0, step.canvas.width, step.canvas.height);
          src = step.canvas; sx = 0; sy = 0; cw = step.canvas.width; ch = step.canvas.height;
        }
        const sharp = new OffscreenCanvas(tw, th).getContext('2d', { willReadFrequently: true });
        sharp.imageSmoothingQuality = 'high';
        sharp.drawImage(src, sx, sy, cw, ch, 0, 0, tw, th);

        // Blurred copy = the patch's lighting; sharp minus blurred = just the grain
        const soft = new OffscreenCanvas(tw, th).getContext('2d', { willReadFrequently: true });
        soft.filter = 'blur(6px)';
        soft.drawImage(sharp.canvas, 0, 0);

        // Drop the edges, where the blur fades to transparent and would show seams between tiles
        const m = 24;
        const iw = tw - m * 2;
        const ih = th - m * 2;
        const a = sharp.getImageData(m, m, iw, ih).data;
        const b = soft.getImageData(m, m, iw, ih).data;
        const delta = new Int16Array(a.length);
        for (let i = 0; i < a.length; i++) delta[i] = a[i] - b[i];
        return { delta, tw: iw, th: ih };
      }

      function paint() {
        if (!source.complete || !source.naturalWidth) return;
        const dpr = window.devicePixelRatio || 1;
        const w = Math.round(stage.clientWidth * dpr);
        const h = Math.round(stage.clientHeight * dpr);
        canvas.width = w;
        canvas.height = h;

        const rect = art.getBoundingClientRect();
        const top = rect.top - stage.getBoundingClientRect().top;
        const gradient = ctx.createLinearGradient(0, top * dpr, 0, (top + rect.height) * dpr);
        STOPS.forEach(([at, colour]) => gradient.addColorStop(at, colour));
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);

        const { delta, tw, th } = grainTile((rect.height * dpr) / source.naturalHeight);
        const img = ctx.getImageData(0, 0, w, h);
        const px = img.data;
        for (let y = 0; y < h; y++) {
          const row = (y % th) * tw;
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const j = (row + (x % tw)) * 4;
            px[i] += delta[j];
            px[i + 1] += delta[j + 1];
            px[i + 2] += delta[j + 2];
          }
        }
        ctx.putImageData(img, 0, 0);
      }

      function sync() {
        if (!art.currentSrc) return;
        if (source.src !== art.currentSrc) source.src = art.currentSrc;
        else paint();
      }

      // Redraw once the frame has actually changed size (rotation, toolbars, window resize);
      // a plain resize event can fire before a phone has finished rotating
      let timer;
      const schedule = () => { clearTimeout(timer); timer = setTimeout(sync, 100); };
      source.addEventListener('load', paint);
      art.addEventListener('load', sync);
      new ResizeObserver(schedule).observe(stage);
      if (art.complete) sync();
    })();

    // Klaviyo public key and list ID are safe to publish: they only allow subscribing.
    const KLAVIYO_PUBLIC_KEY = 'XFG94h';
    const KLAVIYO_LIST_ID = 'YeFbmS';

    const form = document.getElementById('signup');
    const status = document.getElementById('status');
    const button = form.querySelector('button');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = '';

      try {
        const res = await fetch(`https://a.klaviyo.com/client/subscriptions/?company_id=${KLAVIYO_PUBLIC_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/vnd.api+json', revision: '2024-10-15' },
          body: JSON.stringify({
            data: {
              type: 'subscription',
              attributes: {
                custom_source: 'Coming soon page',
                profile: {
                  data: {
                    type: 'profile',
                    attributes: {
                      email: form.email.value.trim(),
                      properties: { age_confirmed_18: true }
                    }
                  }
                }
              },
              relationships: { list: { data: { type: 'list', id: KLAVIYO_LIST_ID } } }
            }
          })
        });
        if (!res.ok) throw new Error(res.status);
        form.reset();
        document.querySelector('.age input').checked = false;
        status.textContent = 'Thanks! Check your inbox to confirm.';
      } catch {
        status.textContent = 'Something went wrong. Please try again.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
